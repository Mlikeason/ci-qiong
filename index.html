<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>詞窮 · Lost for Words</title>

  <!-- iOS / Android home screen integration -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="詞窮">
  <meta name="theme-color" content="#faf8f5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ═══════════════ TOP BAR ═══════════════ -->
  <header class="topbar">
    <div class="brand">
      <img src="icons/logo-64.png" class="brand-logo" alt="">
      <span class="brand-name">詞窮</span>
    </div>
  </header>

  <!-- ═══════════════ PAGE: TODAY ═══════════════ -->
  <section class="page active" id="page-today">

    <div class="section">
      <div class="section-head">
        <div class="section-title serif" id="todayPrompt">你今天主要在做什麼？</div>
        <button class="section-reshuffle" data-category="scene" aria-label="換一批">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
      </div>
      <div class="chips" id="sceneChips"></div>
    </div>

    <div class="section" id="moodSection" style="display:none">
      <div class="section-head">
        <div class="section-title serif">那感覺怎麼樣？</div>
        <button class="section-reshuffle" data-category="mood" aria-label="換一批">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
      </div>
      <div class="chips" id="moodChips"></div>
    </div>

    <div class="section" id="feelingSection" style="display:none">
      <div class="section-head">
        <div class="section-title serif">再具體一點？</div>
        <button class="section-reshuffle" data-category="feeling" aria-label="換一批">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
      </div>
      <div class="chips" id="feelingChips"></div>
    </div>

    <div class="action-row" id="actionRow" style="display:none">
      <button class="btn-primary" id="findBtn">共 鳴 一 句</button>
      <button class="btn-ghost" id="resetBtn">重 選</button>
    </div>

  </section>

  <!-- ═══════════════ PAGE: PICK (3 face-down cards) ═══════════════ -->
  <section class="page pick-page" id="page-pick">
    <div class="pick-prompt">
      <div class="section-label">憑 直 覺</div>
      <div class="pick-prompt-title serif">選你想翻開的那張</div>
    </div>
    <div class="pick-cards" id="pickCards"></div>
    <div class="pick-skip">
      <button id="pickSkip">不挑，隨機給我一張</button>
    </div>
  </section>

  <!-- ═══════════════ PAGE: CARD ═══════════════ -->
  <section class="page card-page" id="page-card">

    <div class="card" id="lyricCard">
      <div class="card-line heavy" id="cardLine"></div>
      <div class="card-attrib" id="cardAttrib">
        <span class="attrib-badge attrib-author" id="cardAuthor"></span>
        <span class="attrib-badge attrib-song" id="cardSong"></span>
      </div>
    </div>

    <div class="card-tags" id="cardTags"></div>

    <div class="card-controls">
      <button id="reshuffleBtn">換 一 句</button>
      <button id="saveBtn">收 入 歲 月</button>
      <button id="exportBtn">分 享</button>
    </div>

  </section>

  <!-- ═══════════════ PAGE: CALENDAR ═══════════════ -->
  <section class="page page-tight" id="page-calendar">
    <div class="cal-header">
      <div class="cal-month serif" id="calMonth"></div>
      <div class="cal-nav">
        <button id="calPrev">←</button>
        <button id="calNext">→</button>
      </div>
    </div>
    <div class="cal-weekdays">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span id="calCount"></span>
    </div>
  </section>

  <!-- ═══════════════ PAGE: REPORT ═══════════════ -->
  <section class="page" id="page-report">
    <div class="report-tabs">
      <div class="report-tab active" data-range="week">本 周</div>
      <div class="report-tab" data-range="month">本 月</div>
    </div>
    <div id="reportBody"></div>
  </section>

  <!-- ═══════════════ MODAL: DAY DETAIL ═══════════════ -->
  <div class="modal-backdrop" id="dayModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-date serif" id="modalDate"></div>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-card" id="modalCard">
        <div class="card-line heavy" id="modalLine"></div>
        <div class="card-attrib">
          <span class="attrib-badge attrib-author" id="modalAuthor"></span>
          <span class="attrib-badge attrib-song" id="modalSong"></span>
        </div>
      </div>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-footer">
        <button id="modalShare">分 享</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ BOTTOM NAV ═══════════════ -->
  <nav class="nav">
    <a href="#today" class="nav-link active" data-page="today">當 下</a>
    <a href="#calendar" class="nav-link" data-page="calendar">歲 月</a>
    <a href="#report" class="nav-link" data-page="report">回 聲</a>
  </nav>

</div>

<script src="lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
